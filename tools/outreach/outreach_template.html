<title>Рассылка владельцам</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Рабочий список: шапка с именем и прогрессом, ниже карточки по группам; отправленные гаснут */
:root {
  --bg: #eef1f0; --card: #ffffff; --fg: #17201c; --muted: #5b6862; --line: #d4ddd8;
  --accent: #1f7a55; --accent-ink: #ffffff; --wa: #1fa855; --done: #9aa8a1;
  --font: "Golos Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --card: #1b221f; --fg: #e8eeeb; --muted: #9db0a7; --line: #2c3631;
  --accent: #4cc38a; --accent-ink: #08140e; --wa: #3ccf75; --done: #5f6e67; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121715; --card: #1b221f; --fg: #e8eeeb; --muted: #9db0a7; --line: #2c3631;
  --accent: #4cc38a; --accent-ink: #08140e; --wa: #3ccf75; --done: #5f6e67; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
h1 { margin: 0; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label.name { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
input#me { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 170px; }
.bar { flex: 1; min-width: 140px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.count { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
h2 { font-size: 15px; margin: 26px 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; margin-bottom: 10px; }
.card.sent { opacity: .55; }
.card.sent .msg { display: none; }
.head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.head b { font-size: 17px; }
.phone { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; user-select: all; }
.msg { white-space: pre-wrap; font-size: 14px; line-height: 1.5; background: var(--bg); border-radius: 10px; padding: 10px 12px; max-height: 9.5em; overflow: auto; min-width: 0; overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 15px; font-weight: 600; border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; min-height: 42px; }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn:focus-visible, .filters button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.done { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 15px; cursor: pointer; }
.done input { width: 22px; height: 22px; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Рассылка владельцам</h1>
    <div class="row">
      <label class="name" for="me">Ваше имя в сообщениях <input id="me" placeholder="Роман" autocomplete="given-name"></label>
    </div>
    <div class="row"><div class="bar"><i id="bar"></i></div><span class="count" id="count">0 из 0</span></div>
    <div class="filters" id="filters"></div>
  </header>
  <p class="note" style="margin-top:12px">Кнопка WhatsApp открывает чат с номером и уже вставленным текстом: проверьте и нажмите «Отправить». В Telegram текст не вставляется, поэтому сначала скопируйте его. Если у номера нет WhatsApp, позвоните или найдите их в Telegram по номеру.</p>
  <main id="list"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*DATA*/[];
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let sent = LS.get('sent', {}); let me = LS.get('me', ''); let filter = LS.get('filter', 'todo');
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const text = (it) => it.text.replace('[Имя]', me.trim() || 'Роман'); // по умолчанию — имя пользователя
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

function render() {
  const groups = [...new Set(DATA.map((d) => d.group))];
  $('#filters').innerHTML = [['todo', 'Не отправлено'], ['all', 'Все'], ...groups.map((g) => [g, g.replace(' — ', ': ')])]
    .map(([k, l]) => `<button type="button" data-f="${esc(k)}" aria-pressed="${filter === k}">${esc(l)}</button>`).join('');
  const shown = DATA.filter((d) => filter === 'all' || (filter === 'todo' ? !sent[d.id] : d.group === filter));
  let html = '', cur = null;
  for (const it of shown) {
    if (it.group !== cur) { cur = it.group; html += `<h2>${esc(cur)}</h2>`; }
    const t = text(it);
    html += `<article class="card ${sent[it.id] ? 'sent' : ''}" data-id="${it.id}">
      <div class="head"><b>${esc(it.name)}</b><span class="phone">${esc(it.phone)}</span></div>
      <div class="msg" id="m${it.id}">${esc(t)}</div>
      <div class="acts">
        ${it.wa ? `<a class="btn wa" href="https://wa.me/${it.wa}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        ${it.tg ? `<a class="btn" href="${esc(it.tg)}" target="_blank" rel="noopener">Telegram</a>` : ''}
        <button type="button" class="btn" data-copy="${it.id}">Скопировать текст</button>
        <label class="done"><input type="checkbox" data-done="${it.id}" ${sent[it.id] ? 'checked' : ''}> Отправил</label>
      </div></article>`;
  }
  $('#list').innerHTML = html || '<p class="note" style="margin-top:20px">Здесь пусто: все сообщения из этого списка отмечены как отправленные.</p>';
  const n = DATA.filter((d) => sent[d.id]).length;
  $('#count').textContent = `${n} из ${DATA.length} отправлено`;
  $('#bar').style.width = (n / DATA.length * 100) + '%';
}

$('#me').value = me;
$('#me').addEventListener('input', (e) => { me = e.target.value; LS.set('me', me); render(); });
document.addEventListener('click', async (e) => {
  const f = e.target.closest('[data-f]'); if (f) { filter = f.dataset.f; LS.set('filter', filter); render(); return; }
  const c = e.target.closest('[data-copy]');
  if (c) { const it = DATA[+c.dataset.copy]; const t = text(it);
    try { await navigator.clipboard.writeText(t); toast('Текст скопирован'); }
    catch (err) { const m = document.getElementById('m' + it.id); const r = document.createRange(); r.selectNodeContents(m); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Текст выделен, скопируйте его'); } }
});
document.addEventListener('change', (e) => {
  const d = e.target.closest('[data-done]'); if (!d) return;
  if (d.checked) sent[d.dataset.done] = 1; else delete sent[d.dataset.done];
  LS.set('sent', sent); render();
});
render();
</script>
